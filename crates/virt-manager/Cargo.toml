[package]
name = "virt-manager"
description = "GTK4 desktop GUI for managing libvirt VMs — see ticket 05 (toolkit choice) and the per-screen tickets in .scratch/rust-conversion/issues/."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "virt-manager"
path = "src/main.rs"

[dependencies]
virtinst-core = { path = "../virtinst-core" }
# Ticket 05. `v4_14` is what Ubuntu 24.04 (the CI runner) ships; nothing
# here needs anything newer yet.
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
# Same libvirt bindings virtinst-core wraps (ticket 02). The GUI talks to
# `virt` directly for the polling/lifecycle calls upstream's
# `virtManager/object/domain.py` makes — that layer lives in the GUI app
# upstream too, not in virtinst.
virt = "0.4"
vte4 = { version = "0.10", features = ["v0_76"] }
sourceview5 = "0.11"
virtinst-xml = { path = "../virtinst-xml" }
clap = { version = "4.5.61", features = ["derive"] }
futures-channel = "0.3"
# Upstream's AppIndicator backend for the system tray (`systray.py`): a
# StatusNotifierItem over D-Bus, since GTK4 has no GtkStatusIcon. The
# async-io runtime instead of the default tokio, so its futures run on
# the GTK main context like everything else here.
ksni = { version = "0.3.7", default-features = false, features = ["async-io"] }
# The freedesktop Secret Service client that upstream's `lib/keyring.py`
# hand-rolls over Gio D-Bus. Same async-io runtime (and zbus) as ksni.
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
# Wipes the console passwords keyring.rs handles (already pulled in by oo7).
zeroize = "1"
#
# Ticket 09's async model: blocking libvirt calls run on OS threads via
# `gio::spawn_blocking`, awaited from `glib::spawn_future_local` on the
# GTK main loop. No tokio.
#
# libgvnc-1.0 (VNC console) and libspice-client-glib-2.0 (SPICE
# console) are linked directly by the hand-written bindings in
# src/gvnc.rs and src/spice.rs.

[build-dependencies]
glib-build-tools = "0.22"
