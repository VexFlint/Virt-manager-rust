[package]
name = "virtinst-core"
description = "Domain/device XML modeling, libvirt connection handling, and install/clone logic shared by the GUI and CLI tools — no GTK dependency (see ticket 15)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
libc = "0.2"
# Logging facade: the CLI tools install the logger (`virtinst-cli`'s
# `cli.rs`, upstream's `setupLogging`), the GUI keeps its own.
log = "0.4"
shlex = "1.3"
# virtinst-xml re-exports edit_xml's Document/Element (ticket 06) — no
# need for a direct edit-xml dependency alongside it.
virtinst-xml = { version = "0.1.0", path = "../virtinst-xml" }
# Rust libvirt bindings (ticket 02). Needs libvirt-dev at build time
# (pkg-config: `libvirt`) — installed on this machine 2026-08-19.
virt = "0.4"
uuid = { version = "1.20.0", features = ["v4"] }
# `bindgen`-bound `libosinfo` (ticket 04, reasserted 2026-08-23 over an
# unchecked "gir-bound" assumption that crept into other tickets — see
# that ticket's amendment). Pure GObject/GLib, no GTK — doesn't violate
# this crate's "no GTK dependency" boundary (ticket 15). The generated
# FFI (`osinfo/ffi.rs`, built by `build.rs`) references glib/gobject/
# gio's own types (`GError`, `GObject`, `GList`, …) rather than
# redefining them, so those three `-sys` crates are real dependencies,
# not just build-time ones.
glib-sys = "0.22"
gobject-sys = "0.22"
gio-sys = "0.22"
ureq = "2"
regex = "1"
#
# gir-generated, not yet vendored/generated (ticket 09):
#   - libvirt-glib event-loop + Connection/Domain signals
# Needs a `gir` codegen pass against the system .gir files (confirmed
# present: libvirt-glib-1.0-dev) — the `gir` codegen tool itself is now
# installed too (wasn't an apt package, built from
# github.com/gtk-rs/gir; unblocked sometime after 2026-08-19).

[build-dependencies]
bindgen = "0.72"
pkg-config = "0.3"
