[package]
name = "virtinst-cli"
description = "virt-install/virt-clone/virt-xml — CLI tools sharing virtinst-core with the GUI, plus a thin CLI-only shell (see ticket 16)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "virt-install"
path = "src/bin/virt-install.rs"

[[bin]]
name = "virt-clone"
path = "src/bin/virt-clone.rs"

[[bin]]
name = "virt-xml"
path = "src/bin/virt-xml.rs"

[dependencies]
libc = "0.2"
log = { version = "0.4", features = ["std"] }
# Same `virt` the core uses, for its auth-callback credential types.
virt = "0.4"
clap = { version = "4.5.61", features = ["derive"] }
virtinst-core = { path = "../virtinst-core" }
virtinst-xml = { version = "0.1.0", path = "../virtinst-xml" }
