# Categorias do "Gerar notas" do GitHub (docs/RELEASES.md, seção 3).
# Cada PR entra na primeira categoria cujo label ele tiver.
changelog:
  categories:
    - title: GUI
      labels: [GUI]
    - title: CLI
      labels: [CLI]
    - title: Fixes
      labels: [bug]
    - title: Infra
      labels: [Infra, documentation]
    - title: Other
      labels: ["*"]
