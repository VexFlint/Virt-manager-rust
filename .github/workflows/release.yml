# Release no GitHub (docs/RELEASES.md, seções 3 e 4).
#
# Tag vX.Y.Z (ou vX.Y.Z-rc.N): confere a versão, roda a CI, gera os pacotes,
# o SHA256SUMS e a atestação de origem, e cria a release como RASCUNHO.
# workflow_dispatch e PRs que mexem no empacotamento: o mesmo, mas só guarda
# os pacotes como artefato do run, sem atestação e sem release (para testar).
# workflow_dispatch com notes_tag (ex.: v1.0.0): só refaz o topo das notas
# dessa release a partir do CHANGELOG, sem compilar nada (job notes).
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**
  workflow_dispatch:
    inputs:
      notes_tag:
        description: "Só refazer as notas da release desta tag (ex.: v1.0.0)"
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: github.event_name != 'workflow_dispatch' || inputs.notes_tag == ''
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Tag == versão do Cargo.toml
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::a tag $GITHUB_REF_NAME não bate com a versão $version do Cargo.toml"
              exit 1
          fi

  ci:
    needs: check
    uses: ./.github/workflows/ci.yml

  # Tarball genérico, compilado no Ubuntu 24.04 (o mesmo runner da CI).
  tarball:
    needs: [check, ci]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # As libs de build da CI (ci.yml) + rst2man para as man pages.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-dev libosinfo-1.0-dev libclang-dev pkg-config libgtk-4-dev libgvnc-1.0-dev libspice-client-glib-2.0-dev libvte-2.91-gtk4-dev libgtksourceview-5-dev python3-docutils gettext
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --workspace --locked
      - name: Tarball
        run: sh packaging/tarball/build.sh "${{ needs.check.outputs.version }}" dist
      - name: Smoke
        run: |
          tar -C "$RUNNER_TEMP" -xzf dist/*.tar.gz
          root=$(echo "$RUNNER_TEMP"/virt-manager-rust-*-x86_64-linux)
          for tool in virt-manager virt-install virt-clone virt-xml; do
              test "$("$root/usr/bin/$tool" --version)" = 5.1.0
          done
          "$root/usr/bin/virt-xml" --help >/dev/null
          "$root/usr/bin/virt-clone" --help >/dev/null
          glib-compile-schemas --strict --dry-run "$root/usr/share/glib-2.0/schemas"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-tarball
          path: dist/*

  # .deb compilado no container de cada distro, contra as libs dela
  # (docs/RELEASES.md, R4). Depends sai do dpkg-shlibdeps.
  deb:
    needs: [check, ci]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            distro: ubuntu24.04
          - image: debian:trixie
            distro: debian13
    container: ${{ matrix.image }}
    steps:
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential dpkg-dev libvirt-dev libosinfo-1.0-dev libclang-dev clang pkg-config libgtk-4-dev libgvnc-1.0-dev libspice-client-glib-2.0-dev libvte-2.91-gtk4-dev libgtksourceview-5-dev python3-docutils gettext
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --workspace --locked
      - name: .deb
        run: sh packaging/deb/build.sh "${{ needs.check.outputs.version }}" "${{ matrix.distro }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-deb-${{ matrix.distro }}
          path: dist/*

  # Instala o .deb num container limpo da mesma distro e roda os binários.
  deb-smoke:
    needs: deb
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            distro: ubuntu24.04
          - image: debian:trixie
            distro: debian13
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pkg-deb-${{ matrix.distro }}
      - name: Instalar
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y ./*.deb
      - name: Smoke
        run: |
          for tool in virt-manager virt-install virt-clone virt-xml; do
              test "$($tool --version)" = 5.1.0
          done
          virt-xml --help >/dev/null
          virt-clone --help >/dev/null
          # O gatilho do glib compilou o schema na instalação.
          test -f /usr/share/glib-2.0/schemas/gschemas.compiled
          dpkg -L virt-manager-rust | grep -q '^/usr/share/man/man1/virt-install.1.gz$'

  # .rpm compilado no container do Fedora (docs/RELEASES.md, R5).
  # Requires de bibliotecas sai do gerador automático do rpm.
  rpm:
    needs: [check, ci]
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Install system dependencies
        run: dnf install -y git gcc rpm-build clang-devel pkgconf-pkg-config libvirt-devel libosinfo-devel gtk4-devel gvnc-devel spice-glib-devel vte291-gtk4-devel gtksourceview5-devel python3-docutils gettext
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --workspace --locked
      - name: .rpm
        run: sh packaging/rpm/build.sh "${{ needs.check.outputs.version }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-rpm
          path: dist/*

  rpm-smoke:
    needs: rpm
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pkg-rpm
      - name: Instalar
        run: dnf install -y ./*.rpm
      - name: Smoke
        run: |
          for tool in virt-manager virt-install virt-clone virt-xml; do
              test "$($tool --version)" = 5.1.0
          done
          virt-xml --help >/dev/null
          virt-clone --help >/dev/null
          test -f /usr/share/glib-2.0/schemas/gschemas.compiled
          rpm -ql virt-manager-rust | grep -q '^/usr/share/man/man1/virt-install.1'

  # Pacote do Arch com o PKGBUILD do repo (docs/RELEASES.md, R6), a partir
  # de um 'git archive' do commit no lugar do tarball da tag.
  arch:
    needs: [check, ci]
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git
      - uses: actions/checkout@v4
      - name: Pacote
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          pkgver=$(echo "$VERSION" | tr - _)
          git config --global --add safe.directory "$PWD"
          build=$(mktemp -d)
          sed "s/^pkgver=.*/pkgver=$pkgver/" packaging/arch/PKGBUILD > "$build/PKGBUILD"
          git archive --prefix="Virt-manager-rust-$pkgver/" -o "$build/virt-manager-rust-$pkgver.tar.gz" HEAD
          # As dependências do PKGBUILD, instaladas como root (o makepkg não roda como root).
          . "$build/PKGBUILD"
          pacman -S --noconfirm --needed "${depends[@]}" "${makedepends[@]}"
          useradd -m builder
          chown -R builder "$build"
          su builder -c "cd $build && makepkg -f --skipchecksums"
          mkdir -p dist
          cp "$build"/*.pkg.tar.zst dist/
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-arch
          path: dist/*

  arch-smoke:
    needs: arch
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pkg-arch
      - name: Instalar
        run: pacman -Syu --noconfirm && pacman -U --noconfirm ./*.pkg.tar.zst
      - name: Smoke
        run: |
          for tool in virt-manager virt-install virt-clone virt-xml; do
              test "$($tool --version)" = 5.1.0
          done
          virt-xml --help >/dev/null
          virt-clone --help >/dev/null
          test -f /usr/share/glib-2.0/schemas/gschemas.compiled
          pacman -Ql virt-manager-rust | grep -q ' /usr/share/man/man1/virt-install.1'

  publish:
    needs: [check, tarball, deb-smoke, rpm-smoke, arch-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Notas (modelo do docs/RELEASES.md, seção 4)
        run: sh packaging/release-notes.sh "${{ needs.check.outputs.version }}" dist > notes.md
      - if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - if: github.ref_type == 'tag'
        name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # 0.x e -rc.N saem como rascunho de pre-release; versões estáveis
          # (1.0.0 em diante) saem publicadas direto como "Latest"
          # (docs/RELEASES.md, seção 2).
          case "$VERSION" in
              0.*|*-rc.*) mode="--draft --prerelease" ;;
              *) mode="--latest" ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* $mode \
              --title "virt-manager-rust $VERSION" \
              --notes-file notes.md --generate-notes
      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.check.outputs.version }}
          path: |
            dist/*
            notes.md

  # Refaz o topo das notas de uma release já publicada com o
  # packaging/release-notes.sh atual (destaques do CHANGELOG) e mantém o
  # "What's Changed" que o GitHub gerou.
  notes:
    if: github.event_name == 'workflow_dispatch' && inputs.notes_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Notas
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.notes_tag }}
        run: |
          gh release view "$TAG" --json body,assets > release.json
          # O script só precisa dos nomes dos arquivos para a tabela.
          mkdir dist
          jq -r '.assets[].name' release.json | while read -r name; do
              : > "dist/$name"
          done
          sh packaging/release-notes.sh "${TAG#v}" dist > notes.md
          jq -r .body release.json | sed -n '/^<!-- Release notes generated/,$p' > generated.md
          test -s generated.md
          printf '\n\n' >> notes.md
          cat generated.md >> notes.md
          gh release edit "$TAG" --notes-file notes.md
